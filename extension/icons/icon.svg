<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Nordic Ultramarine Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="55%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadow for 'S' -->
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0a1432" flood-opacity="0.5" />
    </filter>

    <!-- Glassy Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- 1. Background Squircle (fills frame) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- 2. Electric Cyan Accent Dot in Corner -->
  <circle cx="424" cy="88" r="24" fill="#38bdf8" />

  <!-- 3. Giant, Bold, Centered Serif 'S' -->
  <text x="256" y="380"
        font-family="Georgia, serif"
        font-size="370"
        font-weight="bold"
        text-anchor="middle"
        fill="#ffffff"
        filter="url(#glyphShadow)">S</text>
</svg>
